spring.application.name=account-service
server.port=8082

kafkademo.topic.transactions=transactions

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/kafkademo
spring.datasource.username=kafkademo
spring.datasource.password=kafkademo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ch.kafkademo.common
spring.kafka.consumer.properties.spring.json.value.default.type=ch.kafkademo.common.TransactionEvent

