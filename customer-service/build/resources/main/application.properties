spring.application.name=customer-service
server.port=8083

kafkademo.topic.transactions=transactions

# OAuth 2.0 / OpenID Connect resource server.
# Points at the Keycloak realm; overridable via SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/kafkademo}

# Expose only the health endpoint (kept public in SecurityConfig for probes).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=customer-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.common
spring.kafka.consumer.properties.spring.json.value.default.type=ch.kafkademo.common.TransactionEvent

