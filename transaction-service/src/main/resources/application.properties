spring.application-name=transaction-service
server.port=8083

kafkademo.topic.transactions=transactions

# OAuth 2.0 / OpenID Connect resource server.
# Points at the Keycloak realm; overridable via SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/kafkademo}

# Expose only the health endpoint (kept public in SecurityConfig for probes).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.admin.auto-create=true