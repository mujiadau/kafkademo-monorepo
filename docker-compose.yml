services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafkademo-kafka
    ports:
      # Internal listener for other containers is "kafka:9092".
      # External listener for apps running on the host is "localhost:29092".
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16-alpine
    container_name: kafkademo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kafkademo
      POSTGRES_USER: kafkademo
      POSTGRES_PASSWORD: kafkademo

  # OpenID Connect identity provider. The "kafkademo" realm (client, scope and a
  # demo user "alice") is imported automatically from keycloak/realm-export.json.
  #
  # NOTE: so the token issuer ("iss") matches for both the containers and your
  # host, add the following line to /etc/hosts:
  #     127.0.0.1 keycloak
  # Then request tokens from http://keycloak:8080 and the services (which use
  # http://keycloak:8080 internally) will accept them.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kafkademo-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  transaction-service:
     build:
       context: .
       dockerfile: transaction-service/Dockerfile
     container_name: kafkademo-transaction-service
     ports:
       - "8083:8083"
     depends_on:
       - kafka
       - keycloak
     environment:
       SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
       KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/kafkademo

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: kafkademo-account-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - postgres
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kafkademo
      SPRING_DATASOURCE_USERNAME: kafkademo
      SPRING_DATASOURCE_PASSWORD: kafkademo

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: kafkademo-customer-service
    ports:
      - "8081:8083"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

