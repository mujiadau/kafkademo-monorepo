name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-images:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout repository
        if: matrix.service != 'common'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.service != 'common'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: matrix.service != 'common'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} release image
        if: matrix.service != 'common'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--version', matrix.service)] }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
